name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    name: Lint + Typecheck + i18n check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm --filter @smart-edms/backend db:generate
          pnpm --filter @smart-edms/license-server db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: i18n key check
        run: pnpm i18n:check

  test:
    name: Unit + Integration tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smart_edms_ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: smart_edms_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smart_edms_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://smart_edms_ci:ci_password@localhost:5432/smart_edms_ci?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-at-least-64-characters-long-for-testing-purposes-only-1234567890
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: ci
      S3_SECRET_ACCESS_KEY: ci
      S3_BUCKET: smart-edms-ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smart-edms/backend db:generate
      - run: pnpm --filter @smart-edms/license-server db:generate
      - name: Run migrations
        run: |
          pnpm --filter @smart-edms/backend db:migrate:deploy
          pnpm --filter @smart-edms/license-server db:migrate:deploy
      - name: Run tests
        run: pnpm test

  build:
    name: Build all packages
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: |
          pnpm --filter @smart-edms/types build
          pnpm --filter @smart-edms/schemas build
          pnpm --filter @smart-edms/i18n build
          pnpm --filter @smart-edms/license-core build
      - name: Build apps
        run: |
          pnpm --filter @smart-edms/backend build
          pnpm --filter @smart-edms/license-server build
          pnpm --filter @smart-edms/license-admin build
          pnpm --filter @smart-edms/marketing build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            apps/backend/dist
            apps/license-server/dist
            apps/license-admin/dist
            apps/marketing/.next
          retention-days: 7
