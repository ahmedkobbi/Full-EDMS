# Smart EDMS — Nginx reverse proxy configuration
# Spec ref: §23.2 (reverse proxy — TLS termination, routing, rate limiting, security headers, WebSocket upgrade).

worker_processes auto;
events {
  worker_connections 4096;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 5g;  # Match backend upload limit (5GB)

  # Logging — structured for downstream ingestion
  log_format main escape=json '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request":"$request",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"x_request_id":"$http_x_request_id"'
  '}';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # Rate limit zone (per-IP, 10 req/s burst 20)
  limit_req_zone $binary_remote_addr zone=smart_edms_api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=smart_edms_auth:10m rate=2r/s;

  # Upstreams
  upstream smart_edms_api {
    server api:4000;
    keepalive 32;
  }

  upstream smart_edms_license {
    server license-server:4001;
    keepalive 16;
  }

  # Redirect HTTP → HTTPS
  server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # HTTPS server
  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # TLS — certs mounted at /etc/nginx/certs/
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers (defense-in-depth alongside Helmet)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # API
    location /v1/ {
      limit_req zone=smart_edms_api burst=20 nodelay;
      proxy_pass http://smart_edms_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $http_x_request_id;
      proxy_connect_timeout 10s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
    }

    # Auth — stricter rate limit
    location /v1/auth/ {
      limit_req zone=smart_edms_auth burst=5 nodelay;
      proxy_pass http://smart_edms_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket upgrade (real-time)
    location /realtime/ {
      proxy_pass http://smart_edms_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400s;
    }

    # Health (no rate limit)
    location /v1/health/ {
      proxy_pass http://smart_edms_api;
      access_log off;
    }

    # License server (vendor-hosted; restricted to known networks in production)
    location /v1/license-server/ {
      # Allow only specific IP ranges in production via `allow/deny`
      # allow 10.0.0.0/8;
      # deny all;
      proxy_pass http://smart_edms_license/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
