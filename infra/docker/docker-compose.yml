# Smart EDMS — On-Premise Docker Compose
# Spec ref: §23.1 (on-premise Docker services), §23.2 (reverse proxy).
#
# Services: postgres, redis, minio, opensearch, api, worker, license-server, reverse-proxy
# The marketing page and license-admin are deployed separately (cloud-side, vendor-hosted).

version: '3.9'

networks:
  smart-edms-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  opensearch-data:

services:
  postgres:
    image: postgres:16.4-alpine3.20
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smart_edms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-smart_edms}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-smart_edms}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [smart-edms-net]

  redis:
    image: redis:7.4-alpine3.20
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'allkeys-lru', '--maxmemory', '512mb']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [smart-edms-net]

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-smart_edms_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY required}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [smart-edms-net]

  # Initialize the bucket on first run
  minio-init:
    image: minio/mc:RELEASE.2024-09-13T20-26-02Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-smart_edms_minio} ${S3_SECRET_ACCESS_KEY};
      mc mb -p local/${S3_BUCKET:-smart-edms-documents} || true;
      mc anonymous set none local/${S3_BUCKET:-smart-edms-documents} || true;
      mc version enable local/${S3_BUCKET:-smart-edms-documents} || true;
      exit 0;
      "
    networks: [smart-edms-net]

  opensearch:
    image: opensearchproject/opensearch:2.16.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms1g -Xmx1g'
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?OPENSEARCH_ADMIN_PASSWORD required}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS -u admin:${OPENSEARCH_ADMIN_PASSWORD} http://localhost:9200/_cluster/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [smart-edms-net]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '4000'
      HOST: '0.0.0.0'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-smart_edms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smart_edms}?schema=public
      REDIS_URL: redis://redis:6379
      OPENSEARCH_URL: http://admin:${OPENSEARCH_ADMIN_PASSWORD}@opensearch:9200
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-smart_edms_minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-smart-edms-documents}
      S3_FORCE_PATH_STYLE: 'true'
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_ACCESS_TTL_SECONDS: '900'
      JWT_REFRESH_TTL_SECONDS: '2592000'
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LICENSE_PUBLIC_KEY_PATH: /run/secrets/license-public-key.pem
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL:-http://license-server:4001}
      LICENSE_HEARTBEAT_INTERVAL_SECONDS: '3600'
      LICENSE_GRACE_PERIOD_DAYS: '7'
      LICENSE_EXTENDED_REMEDIATION_DAYS: '30'
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_EXTERNAL_API_URL: ${AI_EXTERNAL_API_URL:-}
      AI_EXTERNAL_API_KEY: ${AI_EXTERNAL_API_KEY:-}
      AI_LOCAL_API_URL: ${AI_LOCAL_API_URL:-}
      RATE_LIMIT_GLOBAL_PER_MINUTE: '200'
      RATE_LIMIT_AUTH_PER_MINUTE: '10'
      RATE_LIMIT_AI_PER_MINUTE: '20'
      UPLOAD_MAX_SIZE_BYTES: '5368709120'
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
    volumes:
      - ./license-public-key.pem:/run/secrets/license-public-key.pem:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/v1/health/ready']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [smart-edms-net]

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ['node', 'dist/worker.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-smart_edms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smart_edms}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-smart_edms_minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-smart-edms-documents}
      S3_FORCE_PATH_STYLE: 'true'
      OPENSEARCH_URL: http://admin:${OPENSEARCH_ADMIN_PASSWORD}@opensearch:9200
      JWT_SECRET: ${JWT_SECRET}
    networks: [smart-edms-net]

  # License Server (vendor-hosted; included here for on-premise "connected" deployments)
  license-server:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.license-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '4001'
      HOST: '0.0.0.0'
      DATABASE_URL: postgresql://${POSTGRES_USER:-smart_edms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smart_edms}_license?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${LICENSE_JWT_SECRET:?LICENSE_JWT_SECRET required}
      LICENSE_SIGNING_KEY_PATH: /run/secrets/license-signing-key.pem
      LICENSE_SIGNING_KID: ${LICENSE_SIGNING_KID:?LICENSE_SIGNING_KID required}
      LICENSE_SIGNING_ALG: ${LICENSE_SIGNING_ALG:-EdDSA}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./license-signing-key.pem:/run/secrets/license-signing-key.pem:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4001/v1/health/live']
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [smart-edms-net]

  reverse-proxy:
    image: nginx:1.27.2-alpine3.20
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${SMART_EDMS_HTTP_PORT:-80}:80'
      - '${SMART_EDMS_HTTPS_PORT:-443}:443'
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    networks: [smart-edms-net]
